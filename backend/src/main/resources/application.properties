# Application Name
spring.application.name=finpilot-ai

# Server Port
server.port=8080

# MongoDB Configuration (Default local connection)
spring.data.mongodb.uri=mongodb://localhost:27017/finpilot_db

# File Upload Multipart limits (Allow up to 10MB CSV files)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Gemini AI API Configuration (Supported model: gemini-3.6-flash)
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.model=gemini-3.6-flash
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent
